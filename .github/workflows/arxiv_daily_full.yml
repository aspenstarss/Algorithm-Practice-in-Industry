# 合并后的完整工作流：处理arxiv论文、生成HTML并部署到GitHub Pages
name: arxiv_daily_full
on:
  # 定时触发
  schedule:
    # 每天UTC时间3:23（北京时间11:23）执行，避开整点和高峰自动任务
    - cron: '23 3 * * *'
  # 手动触发
  workflow_dispatch:

concurrency:
  # 与 arxiv_daily_recovery 共用一组，新任务排队而非取消在跑任务，避免互相抢 main
  group: arxiv-daily
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.8"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  process_and_deploy_arxiv:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      issues: write
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Debug time
        run: |
          echo "UTC:"
          date -u
          echo "Local:"
          date
          echo "Beijing:"
          TZ=Asia/Shanghai date

      # 检出代码
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          lfs: true

      # 检出 data 分支并挂载为 data/ 目录（每日 JSON 存这里，main 只放代码）
      - name: Checkout data branch
        uses: actions/checkout@v3
        with:
          ref: data
          path: paperBotV2/arxiv_daily/data

      # 设置Python环境
      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 快速单测：业务日/数据存取的回归防线（<5s）
      - name: Run unit tests
        run: python -m pytest tests/ -q

      # 执行脚本生成JSON数据
      - name: Run arxiv.py to generate JSON
        env:
          # 抓取/排序参数的唯一来源是 paperBotV2/arxiv_daily/config.py（调参走 git）；
          # LLM 提供商：key 存 Secrets；模型/端点存 Actions Variables（留空回落 DeepSeek）
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          FEISHU_URL: ${{ secrets.FEISHU_URL }}
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "🚀 arxiv.py workflow 外层尝试 ${attempt}/${max_attempts}"

            if python -m paperBotV2.arxiv_daily.arxiv; then
              echo "✅ arxiv.py 执行成功"
              exit 0
            fi

            exit_code=$?
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ arxiv.py 已达到 workflow 外层最大重试次数，最终失败"
              exit "$exit_code"
            fi

            if [ "$attempt" -eq 1 ]; then
              wait_seconds=1800
            else
              wait_seconds=3600
            fi

            echo "⏳ arxiv.py 执行失败，等待 ${wait_seconds}s 后进行下一次 workflow 外层重试"
            sleep "$wait_seconds"
          done

      # 提交并推送 data 分支：数据尽早落库，后续步骤失败也不丢
      - name: Commit and push data branch
        run: |
          cd paperBotV2/arxiv_daily/data
          git config user.email "action@github.com"
          git config user.name "github-actions"
          git add --all .
          git reset -- results.json >/dev/null 2>&1 || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "data 分支无变更"
            exit 0
          fi
          git commit -m "data: $(date -u +%Y%m%d) arxiv papers"
          for i in 1 2 3; do
            if git pull --rebase origin data && git push origin HEAD:data; then
              exit 0
            fi
            echo "⏳ data push 第 ${i}/3 次失败，30s 后重试"
            git rebase --abort 2>/dev/null || true
            sleep 30
          done
          exit 1

      # 生成HTML页面
      - name: Generate HTML pages
        run: |
          cd paperBotV2/arxiv_daily
          python generate_arxiv_html.py
          # 生成脚本内部可能吞掉异常并以 0 退出；无 HTML 时在这里显式失败，避免空部署
          ls output/arxiv_*.html >/dev/null
        env:
          # 确保脚本可以找到JSON文件
          PYTHONPATH: ${{ github.workspace }}

      - name: Mark HTML generated
        run: |
          python - <<'PY'
          from paperBotV2.arxiv_daily.status import update_today_output
          updated = update_today_output(html_generated=True)
          print(f"HTML generated status updated: {updated}")
          PY
        env:
          PYTHONPATH: ${{ github.workspace }}

      # 检查是否生成了HTML文件
      - name: Check generated files
        run: |
          echo "检查生成的HTML文件："
          ls -la paperBotV2/arxiv_daily/output/
          echo "检查生成的JSON文件："
          ls -la paperBotV2/arxiv_daily/data/

      # Commit files
      - name: Commit files
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add --all
          if [ -z "$(git status --porcelain)" ]; then
             echo "push=false" >> "$GITHUB_OUTPUT"
          else
             git commit -m "chore: update arxiv papers and HTML" -a
             echo "push=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # Push changes：先同步远端再推（ad-m/github-push-action 不做 fetch，并发写入时会 non-fast-forward）
      - name: Push changes
        if: steps.commit.outputs.push == 'true'
        run: |
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "⏳ push 第 ${i}/3 次失败，30s 后重试"
            git rebase --abort 2>/dev/null || true
            sleep 30
          done
          exit 1

      # 创建或更新gh-pages分支
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./paperBotV2/arxiv_daily/output
          destination_dir: arxiv_daily
          publish_branch: gh-pages
          commit_message: "docs: update arXiv papers HTML pages"
          full_commit_message: "docs: update arXiv papers HTML pages ${{ github.sha }}"
          force_orphan: false

      # 更新README或其他地方的链接，指向最新的HTML页面
      - name: Update latest paper link
        if: always()
        run: |
          # 获取最新的HTML文件名
          LATEST_HTML=$(ls -t paperBotV2/arxiv_daily/output/*.html 2>/dev/null | head -n 1)
          if [ -n "$LATEST_HTML" ]; then
            LATEST_HTML_NAME=$(basename "$LATEST_HTML")
            REPO_URL="https://${{ github.repository_owner }}.github.io/Algorithm-Practice-in-Industry/arxiv_daily"
            echo "最新HTML文件: $LATEST_HTML_NAME"
            echo "GitHub Pages URL: $REPO_URL/$LATEST_HTML_NAME"
            
            # 这里可以添加更新README等文件的逻辑，例如：
            # sed -i "s|https://.*arxiv_[0-9]\{8\}\.html|$REPO_URL/$LATEST_HTML_NAME|g" README.md
          fi

      - name: Commit status on failure
        if: failure()
        id: failure_status_commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          if [ -d paperBotV2/arxiv_daily/status ]; then
            git add paperBotV2/arxiv_daily/status/
          fi
          if [ -z "$(git status --porcelain -- paperBotV2/arxiv_daily/status/)" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update failed arxiv daily status"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Push status on failure
        if: failure() && steps.failure_status_commit.outputs.push == 'true'
        run: |
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "⏳ status push 第 ${i}/3 次失败，30s 后重试"
            git rebase --abort 2>/dev/null || true
            sleep 30
          done
          exit 1
